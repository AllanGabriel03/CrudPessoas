<div id="div-form">
    <form id="form-pessoa">
        <label for="nome">Nome*</label>
        <input type="text" name="nome" id="nome" class="elem-form-01" required maxlength="60" placeholder="Seu nome">

        <label for="email">email*</label>
        <input type="email" name="email" id="email"  class="elem-form-01" required maxlength="60" placeholder="Seu email">

        <label for="cpf">CPF*</label>
        <input type="number" name="cpf" id="cpf"  class="elem-form-02" required maxlength="60" placeholder="Seu cpf">

        <label for="data-nascimento">data-nascimento*</label>
        <input type="date" name="data-nascimento" id="data-nascimento"  class="elem-form-02" required maxlength="60" placeholder="Seu data-nascimento">

        <label for="uf">UF*</label>
        <select name="uf" id="uf" class="elem-form-02">
            <option value="">UF</option>
            <option value="Se">Se</option>
            <option value="Ba">Ba</option>
            <option value="Al">Al</option>
        </select>

        <label for="cidade">Cidade*</label>
        <select name="cidade" id="cidade" class="elem-form-02">
            <option value="">Cidade</option>
            <option value="Aracaju">Aracaju</option>
            <option value="São Critóvão">São Critóvão</option>
            <option value="Barra dos Coqueiros">Barra dos Coqueiros</option>
        </select>

        <div id="div-btns">
            <button type="button" id="btnSalvar"> Salvar </button>
            <button type="reset" id="btnLimpar"> Limpar </button>
        </div>
    </form>
</div>
